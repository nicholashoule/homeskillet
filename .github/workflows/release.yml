# Release: when a version tag is pushed, build the release binaries with make
# cross and publish them as a GitHub Release, with the tag's CHANGELOG.md
# section as the notes and a SHA256SUMS file to check the binaries against.
# See docs/release.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the Release
      id-token: write # sign the provenance attestation
      attestations: write # store it
    env:
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the next step can find the tag on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          # A release builds from nothing a cache from another run could have
          # planted.
          cache: false

      # Versions are tagged on main after merging, so a tag anywhere else would
      # publish code that never passed CI on main.
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is not on main; tag a commit on main after merging"
            exit 1
          fi

      # The notes, the binaries and SHA256SUMS, and the check that every binary
      # reports the tag from a clean tree. CI runs the same script on every
      # pull request, so a change that would break this step fails there
      # first. The notes go outside the checkout, which must stay clean.
      - name: Build
        run: bash tools/release/build.sh "$TAG" "$RUNNER_TEMP/notes.md"

      # Signed provenance for each binary: a statement, kept by GitHub and
      # checked with gh attestation verify, that this workflow built it from
      # this commit, which SHA256SUMS alone cannot say. Attestations are
      # free for public repositories only, so a private one skips this step.
      - name: Attest provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: bin/homeskillet-*-*

      # A tag with a pre-release part, such as v1.2.3-rc.1, makes a pre-release.
      # A Release that already exists, after a failed upload or one made by
      # hand in the web interface, is brought to the same state a fresh run
      # creates: title, notes, pre-release flag, and files.
      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          prerelease=false
          if [[ $TAG == *-* ]]; then
            prerelease=true
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "homeskillet $TAG" --notes-file "$notes" --prerelease="$prerelease"
            gh release upload "$TAG" bin/homeskillet-*-* bin/SHA256SUMS --clobber
          else
            gh release create "$TAG" bin/homeskillet-*-* bin/SHA256SUMS --verify-tag \
              --title "homeskillet $TAG" --notes-file "$notes" --prerelease="$prerelease"
          fi
