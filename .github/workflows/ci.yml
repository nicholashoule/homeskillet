# CI: the checks `make check` runs, on every Go release from the go.mod floor to
# the latest, on Linux and macOS; on Windows, the packages that build there and
# the unsupported-system refusal; release cross builds; and golangci-lint,
# repogov, and demojify. See Continuous Integration in docs/development.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 1.24 is the go.mod floor; "stable" is the latest Go release.
        go-version: ["1.24", "1.25", "stable"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token is not left in .git/config.
          persist-credentials: false

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go-version }}

      # make vet also vets the macOS and Windows builds. On macOS the recipes
      # run under its GNU Make 3.81, the oldest the Makefile supports.
      - name: Vet
        if: runner.os != 'Windows'
        run: make vet

      - name: Test
        if: runner.os != 'Windows'
        run: make test

      # homeskillet refuses to run on Windows for now (docs/windows.md). What
      # builds there is tested there: the packages without Unix-only code and
      # the program's refusal.
      - name: Vet and test (Windows)
        if: runner.os == 'Windows'
        run: |
          go vet ./...
          go test ./...

      - name: Refuses to run (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          go build -o homeskillet.exe .
          if output=$(./homeskillet.exe 2>&1); then
            echo "::error::homeskillet.exe succeeded on Windows: $output"
            exit 1
          fi
          echo "$output"
          [[ $output == *"Windows isn't supported"* ]]

      - name: Release builds
        if: matrix.go-version == 'stable' && runner.os == 'Linux'
        run: make cross

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # golangci-lint cannot analyze standard-library files from a Go
          # newer than the one it was built with, so this stays on the
          # release line its binaries are built with.
          go-version: "1.26.x"
          cache: false

      # Also checks formatting: .golangci.yml enables gofmt -s and goimports.
      # Keep the version in step with the one used locally (make check).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.15.0

      # Markdown line limits and the agent-instruction layout, configured in
      # .github/repogov-config.json. Pinned to a release;
      # .github/copilot-instructions.md lists every file to bump with it.
      - name: repogov
        run: go run github.com/nicholashoule/repogov/cmd/repogov@v0.9.0 -agent copilot all

      # Emoji in Go, Markdown, YAML, and JSON files. It only reports, never
      # rewrites, and skips _test.go files, which may hold emoji as test input.
      # Pinned like repogov; bump it in the same files.
      - name: demojify
        run: >
          go run github.com/nicholashoule/demojify-sanitize/cmd/demojify@v1.2.0
          -root . -exts .go,.md,.yml,.yaml,.json
