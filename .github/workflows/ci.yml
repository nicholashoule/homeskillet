# CI: the checks `make check` runs, on every Go release from the go.mod floor to
# the latest, on Linux, macOS, and Windows, where a built homeskillet also links
# and unlinks a repository; release cross builds; and golangci-lint for the
# Linux and Windows builds, repogov, and demojify. See Continuous Integration
# in docs/development.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 1.24 is the go.mod floor; "stable" is the latest Go release.
        go-version: ["1.24", "1.25", "stable"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token is not left in .git/config.
          persist-credentials: false

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      # make vet also vets the macOS and Windows builds. On macOS the recipes
      # run under its GNU Make 3.81, the oldest the Makefile supports.
      - name: Vet
        if: runner.os != 'Windows'
        run: make vet

      - name: Test
        if: runner.os != 'Windows'
        run: make test

      # The Makefile targets Linux and macOS, so Windows runs the same checks
      # directly. The runner runs them elevated, which is also what lets the
      # tests make symlinks there (docs/windows.md).
      - name: Vet and test (Windows)
        if: runner.os == 'Windows'
        run: |
          go vet ./...
          go test ./...

      # A built homeskillet links a repository into a scratch home, reports it,
      # and unlinks it, as a user would. The runner is elevated, which every
      # command refuses without --allow-root.
      - name: Link and unlink (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          go build -o homeskillet.exe .
          $root = Join-Path ([IO.Path]::GetTempPath()) homeskillet-smoke
          $repo, $scratch = (Join-Path $root repo), (Join-Path $root home)
          $file = '.config/powershell/profile.ps1'
          $source, $target = (Join-Path $repo "home/$file"), (Join-Path $scratch $file)
          New-Item -ItemType Directory -Force (Split-Path $source), $scratch | Out-Null
          Set-Content -LiteralPath $source -Value '# profile'
          ./homeskillet.exe link --allow-root --home $scratch $repo
          if ((Get-Item -LiteralPath $target).LinkType -ne 'SymbolicLink') { throw 'link made no symlink' }
          ./homeskillet.exe status --allow-root --home $scratch $repo
          ./homeskillet.exe unlink --allow-root --home $scratch $repo
          if (Test-Path -LiteralPath $target) { throw 'unlink left the symlink' }

      - name: Release builds
        if: matrix.go-version == 'stable' && runner.os == 'Linux'
        run: make cross

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # golangci-lint cannot analyze standard-library files from a Go
          # newer than the one it was built with, so this stays on the
          # release line its binaries are built with.
          go-version: "1.26.x"
          cache: false

      # Also checks formatting: .golangci.yml enables gofmt -s and goimports.
      # Keep the version in step with the one used locally (make check).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      # Files for Windows build only there, so a Linux lint never sees them.
      - name: golangci-lint (Windows build)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: windows
        with:
          version: v2.15.0

      # Markdown line limits and the agent-instruction layout, configured in
      # .github/repogov-config.json. Pinned to a release;
      # .github/copilot-instructions.md lists every file to bump with it.
      - name: repogov
        run: go run github.com/nicholashoule/repogov/cmd/repogov@v0.9.0 -agent copilot all

      # Emoji in Go, Markdown, YAML, and JSON files. It only reports, never
      # rewrites, and skips _test.go files, which may hold emoji as test input.
      # Pinned like repogov; bump it in the same files.
      - name: demojify
        run: >
          go run github.com/nicholashoule/demojify-sanitize/cmd/demojify@v1.2.0
          -root . -exts .go,.md,.yml,.yaml,.json
